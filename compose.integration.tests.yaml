name: nuevamente-gemini-validation

# Entorno de ensayo independiente: no publica puertos ni utiliza el volumen real.
services:
  backend:
    image: nuevamente-backend-validation:local
    build:
      context: backend
      dockerfile: Dockerfile
      target: runtime
    init: true
    environment:
      IA_BASE_URL: http://ia-http:8001
      IA_HTTP_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
      MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-10485760}"
    depends_on:
      ia-http:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  ia-http:
    image: nuevamente-ia-validation:local
    build:
      context: .
      dockerfile: ia/docker/Dockerfile.http
      target: runtime
    init: true
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env}"
      GEMINI_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env}"
      DATAIA_GOOGLE_API_KEY: "${DATAIA_GOOGLE_API_KEY:-}"
      DATAIA_ENRICH_BATCH_SIZE: "${DATAIA_ENRICH_BATCH_SIZE:-15}"
      LLM_PROVIDER: gemini
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      IA_STRICT_PROVIDERS: "1"
      IA_MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-10485760}"
      IA_PROVIDER_TIMEOUT_SECONDS: "${IA_PROVIDER_TIMEOUT_SECONDS:-60}"
      IA_PROVIDER_MAX_RETRIES: "${IA_PROVIDER_MAX_RETRIES:-1}"
      IA_PIPELINE_TIMEOUT_SECONDS: "${IA_PIPELINE_TIMEOUT_SECONDS:-480}"
      IA_CALLER_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
    volumes:
      - ia-data:/workspace/data
      - ./tests/integration:/checks:ro

  tests:
    image: nuevamente-backend-tests:local
    build:
      context: backend
      dockerfile: Dockerfile
      target: tests
    environment:
      TEST_BACKEND_URL: http://backend:8000
      TEST_IA_URL: http://ia-http:8001
      TEST_HTTP_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
    volumes:
      - ./tests/integration:/checks:ro
      - ./nuevamente-ai-core/tests:/fixtures:ro
      - type: bind
        source: "${TEST_ARTIFACTS_DIR:?Usar scripts/probar-integracion.ps1 para crear el directorio privado de resultados}"
        target: /results
    command: [python, -m, pytest, /checks/test_gemini.py, -q, --tb=short]

volumes:
  ia-data:
