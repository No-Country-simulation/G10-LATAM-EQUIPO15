name: nuevamente-integration

services:
  frontend:
    image: adaptive-content-frontend:dev
    build:
      context: frontend
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18003}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backend:
    image: adaptive-content-backend:dev
    build:
      context: backend
      dockerfile: Dockerfile
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18002}:8000"
    environment:
      IA_BASE_URL: http://ia-http:8001
      IA_HTTP_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
      MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-26214400}"
      OCI_BUCKET_NAME: "${OCI_BUCKET_NAME:-nuevamente-contenidos-educativos}"
      OCI_STORAGE_ENABLED: "${OCI_STORAGE_ENABLED:-false}"
      OCI_NAMESPACE: "${OCI_NAMESPACE:-}"
      OCI_REGION: "${OCI_REGION:-}"
      OCI_AUTH_MODE: "${OCI_AUTH_MODE:-api_key}"
      OCI_CONFIG_FILE: "${OCI_CONFIG_FILE:-/run/secrets/oci/config}"
      OCI_CONFIG_PROFILE: "${OCI_CONFIG_PROFILE:-DEFAULT}"
      OCI_HTTP_TIMEOUT_SECONDS: "${OCI_HTTP_TIMEOUT_SECONDS:-10}"
    depends_on:
      ia-http:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  ia-http:
    image: adaptive-content-ia-http:dev
    build:
      context: .
      dockerfile: ia/docker/Dockerfile.http
      target: runtime
    init: true
    expose: ["8001"]
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      GEMINI_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      # Opcional: clave propia para ingestión, chunking y embeddings (Data/IA); si está vacía se usa GOOGLE_API_KEY
      DATAIA_GOOGLE_API_KEY: "${DATAIA_GOOGLE_API_KEY:-}"
      DATAIA_ENRICH_BATCH_SIZE: "${DATAIA_ENRICH_BATCH_SIZE:-15}"
      DATAIA_ENRICH_CONCURRENCY: "${DATAIA_ENRICH_CONCURRENCY:-4}"
      DATAIA_ENRICH_MAX_CHARS: "${DATAIA_ENRICH_MAX_CHARS:-120000}"
      # Opcional: la generación no usa búsqueda vectorial; activar solo para indexar en Chroma
      DATAIA_EMBEDDINGS_ENABLED: "${DATAIA_EMBEDDINGS_ENABLED:-false}"
      LLM_PROVIDER: gemini
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      # Respaldo ante 503/429: otros modelos Gemini (cuota propia) y luego Groq si hay clave
      GEMINI_FALLBACK_MODELS: "${GEMINI_FALLBACK_MODELS:-gemini-3.1-flash-lite}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-20b,openai/gpt-oss-120b}"
      GROQ_CRITIC_MODEL: "${GROQ_CRITIC_MODEL:-openai/gpt-oss-120b,openai/gpt-oss-20b}"
      IA_STRICT_PROVIDERS: "1"
      IA_MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-26214400}"
      IA_MAX_PAGINAS: "${IA_MAX_PAGINAS:-50}"
      IA_MAX_TOKENS_DOCUMENTO: "${IA_MAX_TOKENS_DOCUMENTO:-24000}"
      IA_PROVIDER_TIMEOUT_SECONDS: "${IA_PROVIDER_TIMEOUT_SECONDS:-60}"
      IA_PROVIDER_MAX_RETRIES: "${IA_PROVIDER_MAX_RETRIES:-1}"
      IA_PIPELINE_TIMEOUT_SECONDS: "${IA_PIPELINE_TIMEOUT_SECONDS:-480}"
      IA_CONTEXTO_PRESUPUESTO_TOKENS: "${IA_CONTEXTO_PRESUPUESTO_TOKENS:-24000}"
      IA_CALLER_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
    # ChromaDB, registro de documentos y cachés: un documento se ingiere una sola vez
    volumes:
      - ia-data:/workspace/data

volumes:
  ia-data:
