# Solo con autenticación api_key. El directorio privado contiene config y key.pem.
# El archivo config debe usar key_file=/run/secrets/oci/key.pem.
services:
  backend:
    volumes:
      - type: bind
        source: "${OCI_CREDENTIALS_DIRECTORY:?Indicar un directorio privado existente fuera del repositorio}"
        target: /run/secrets/oci
        read_only: true
        bind:
          create_host_path: false
