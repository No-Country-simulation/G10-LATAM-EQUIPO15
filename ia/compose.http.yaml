name: nuevamente-ia-http

services:
  ia-http:
    image: adaptive-content-ia-http:dev
    build:
      context: ..
      dockerfile: ia/docker/Dockerfile.http
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${IA_PORT:-18001}:8001"
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      GEMINI_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      LLM_PROVIDER: gemini
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash-lite}"
      IA_STRICT_PROVIDERS: "1"
      IA_MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-10485760}"
      IA_PROVIDER_TIMEOUT_SECONDS: "${IA_PROVIDER_TIMEOUT_SECONDS:-60}"
      IA_PROVIDER_MAX_RETRIES: "${IA_PROVIDER_MAX_RETRIES:-1}"
      IA_PIPELINE_TIMEOUT_SECONDS: "${IA_PIPELINE_TIMEOUT_SECONDS:-480}"
      IA_CALLER_TIMEOUT_SECONDS: "${IA_CALLER_TIMEOUT_SECONDS:-600}"

  ia-http-tests:
    image: adaptive-content-ia-http-tests:dev
    profiles: [tests]
    build:
      context: ..
      dockerfile: ia/docker/Dockerfile.http
      target: tests
    network_mode: none
