name: nuevamente-ia-http

services:
  ia-http:
    image: adaptive-content-ia-http:dev
    build:
      context: ..
      dockerfile: ia/docker/Dockerfile.http
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${IA_PORT:-18001}:8001"
    environment:
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      GEMINI_API_KEY: "${GOOGLE_API_KEY:?Completar GOOGLE_API_KEY en ia/.env y usar --env-file ia/.env}"
      # Opcional: clave propia para ingestión, chunking y embeddings (Data/IA); si está vacía se usa GOOGLE_API_KEY
      DATAIA_GOOGLE_API_KEY: "${DATAIA_GOOGLE_API_KEY:-}"
      LLM_PROVIDER: gemini
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.1-flash-lite}"
      IA_STRICT_PROVIDERS: "1"
      IA_MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-10485760}"
    # ChromaDB, registro de documentos y cachés: un documento se ingiere una sola vez
    volumes:
      - ia-data:/workspace/data

  ia-http-tests:
    image: adaptive-content-ia-http-tests:dev
    profiles: [tests]
    build:
      context: ..
      dockerfile: ia/docker/Dockerfile.http
      target: tests
    network_mode: none

volumes:
  ia-data:
