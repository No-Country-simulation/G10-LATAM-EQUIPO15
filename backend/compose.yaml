name: adaptive-content

services:
  backend:
    image: adaptive-content-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OCI_BUCKET_NAME: "${OCI_BUCKET_NAME:-nuevamente-contenidos-educativos}"
      IA_BASE_URL: "${IA_BASE_URL:-http://ia-http:8001}"
      IA_HTTP_TIMEOUT_SECONDS: "${IA_HTTP_TIMEOUT_SECONDS:-600}"
      MAX_DOCUMENT_BYTES: "${IA_MAX_DOCUMENT_BYTES:-10485760}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend-tests:
    image: adaptive-content-backend-tests:dev
    profiles: [tests]
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    network_mode: none
