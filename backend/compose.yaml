name: adaptive-content

services:
  backend:
    image: adaptive-content-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      OCI_BUCKET_NAME: "${OCI_BUCKET_NAME:-nuevamente-contenidos-educativos}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
