<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NuevaMente</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="encabezado">
    <h1>NuevaMente</h1>
    <p>Convierte conocimiento técnico en aprendizaje real</p>
  </header>

  <main class="contenedor-principal">

    <!-- Estado IDLE: en esta sección hacemos la carga del documento + configuración (FE-01 / FE-02) -->
    <section id="seccion-carga">
      <h2>Cargar el documento y configurarlo</h2>
      <form id="form-configuracion">
        <div class="campo">
          <label for="documento">Documento técnico (PDF, Markdown o texto)</label>
          <input type="file" id="documento" name="documento" accept=".pdf,.md,.txt" required />
        </div>

        <div class="campo">
          <label for="documento_titulo">Título del documento</label>
          <input type="text" id="documento_titulo" name="documento_titulo" placeholder="Ej: Introducción a VCN en OCI" />
        </div>

        <div class="campo">
          <label for="perfil_destinatario">Perfil del destinatario</label>
          <select id="perfil_destinatario" name="perfil_destinatario" required>
            <option value="Principiante">Principiante / Transición de carrera</option>
            <option value="Junior/SemiSenior">Desarrollador Junior / Semi Senior</option>
            <option value="Lider Tecnico">Líder Técnico / Arquitecto</option>
            <option value="Gestor">Gestor / Ejecutivo (no técnico)</option>
          </select>
        </div>

        <div class="campo">
          <label for="formato_salida">Formato pedagógico de salida</label>
          <select id="formato_salida" name="formato_salida" required>
            <option value="Tutorial">Guía práctica paso a paso (Tutorial)</option>
            <option value="Flashcards">Flashcards de memorización</option>
            <option value="Quiz">Quiz interactivo con justificaciones</option>
            <option value="TL;DR">Resumen ejecutivo (TL;DR)</option>
            <option value="Guion">Guion de clase / video</option>
          </select>
        </div>

        <div class="campo">
          <label for="nicho_sector">Nicho / contexto de aplicación</label>
          <select id="nicho_sector" name="nicho_sector">
            <option value="General">General</option>
            <option value="Fintech">Fintech</option>
            <option value="Salud">Salud</option>
            <option value="E-commerce">E-commerce</option>
          </select>
        </div>

        <button type="submit">Generar contenido educativo</button>
      </form>
    </section>

    <!-- Estados SUBMITTED / PROCESSING (placeholder — el stepper real es de Semana 3) -->
    <section id="seccion-procesando" class="oculto">
      <h2>2. Procesando tu documento…</h2>
      <div class="spinner" aria-hidden="true"></div>
      <p>Estamos extrayendo el contenido y generando tu material educativo.</p>
      <!-- TODO Semana 3: acá va el stepper de telemetría en vivo (FE-04) -->
    </section>

    <!-- Estado COMPLETED (placeholder de FE-03, formato Flashcards) -->
    <section id="seccion-resultado" class="oculto">
      <h2 id="resultado-titulo"></h2>
      <p id="resultado-intro"></p>
      <p id="resultado-tiempo" class="meta"></p>
      <p id="resultado-conceptos" class="meta"></p>

      <div id="resultado-items" class="grid-flashcards"></div>

      <button id="boton-nuevo">Generar otro contenido</button>
    </section>

    <!-- Estado ERROR -->
    <section id="seccion-error" class="oculto">
      <h2>Ocurrió un problema</h2>
      <p id="mensaje-error"></p>
      <button id="boton-reintentar">Reintentar</button>
    </section>

  </main>

  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
